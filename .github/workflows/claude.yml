name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # lets Claude read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # Typecheck, tests and lint all run from path.ux. Paired PRs use the same branch
      # name in both repositories, so that branch is preferred to master.
      - name: Clone path.ux
        env:
          GH_TOKEN: ${{ github.token }}
          # Empty when the event is on an issue rather than a PR
          PR_NUMBER: ${{ github.event.pull_request.number || (github.event.issue.pull_request && github.event.issue.number) }}
        run: |
          url=https://github.com/joeedh/path.ux.git
          branch=master
          if [ -n "$PR_NUMBER" ]; then
            head=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefName --jq .headRefName)
            if git ls-remote --exit-code --heads "$url" "refs/heads/$head" > /dev/null; then
              branch=$head
            fi
          fi
          echo "Using path.ux branch $branch"
          git clone --depth 1 --branch="$branch" "$url" ../path.ux

      # A symlink would not work: TypeScript resolves it, and `../../core` then misses path.ux
      - name: Mount this repository as the path.ux submodule
        run: |
          mkdir -p ../path.ux/scripts/path-controller
          sudo mount --bind "$GITHUB_WORKSPACE" ../path.ux/scripts/path-controller

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: ../path.ux/package.json

      # No pnpm cache: setup-node only hashes lockfiles inside the workspace
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Skips the electron and nw binary downloads; only the lint tooling needs a build step
      - name: Install dependencies
        working-directory: ../path.ux
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm rebuild comment-lint unrs-resolver

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --add-dir ../path.ux
            --append-system-prompt "This repository is a submodule of path.ux. A checkout of path.ux is at ../path.ux, and this working directory is mounted inside it at scripts/path-controller, so edits made here take effect there. Edit files here, and treat the rest of ../path.ux as read-only because changes to it are not pushed. Read ../path.ux/CLAUDE.md and ../path.ux/documentation/proseStyle.md first, and follow their rules. The tests are in ../path.ux/tests. Run the checks from this directory, in this form: pnpm --dir ../path.ux run typecheck, pnpm --dir ../path.ux run test, pnpm --dir ../path.ux run lint:check, pnpm --dir ../path.ux run format:check."
            --allowedTools "Bash(pnpm --dir ../path.ux run typecheck),Bash(pnpm --dir ../path.ux run test:*),Bash(pnpm --dir ../path.ux run lint:check),Bash(pnpm --dir ../path.ux run format:check),Bash(pnpm --dir ../path.ux exec tsgo:*),Bash(pnpm --dir ../path.ux exec vitest:*)"
